name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Bare-metal x86 kernel: proves the OS itself still compiles and links.
  kernel:
    name: Kernel (x86 bare metal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib grub-common

      - name: Build kernel
        run: make CROSS= kernel

      - name: Show kernel layout
        run: |
          readelf -hlS build/astro.elf
          echo "Multiboot magic (02 b0 ad 1b) must appear in the first 8192 bytes:"
          od -A d -t x1 -N 8192 -v build/astro.elf | grep -n "02 b0 ad 1b" || echo "not found at a line start"

      - name: Verify Multiboot header
        run: grub-file --is-x86-multiboot build/astro.elf

      - uses: actions/upload-artifact@v4
        with:
          name: astro-kernel
          path: build/astro.elf
          if-no-files-found: error

  # Windows simulator: Astro's graphical home screen in a normal Win32 window.
  # It never replaces or touches the host system.
  simulator:
    name: Simulator (Windows .exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            mingw-w64-x86_64-gcc

      - name: Build simulator
        run: make sim

      - name: Render preview frames
        run: make preview

      - uses: actions/upload-artifact@v4
        with:
          name: astro-sim-windows
          path: build/sim/astro-sim.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: astro-preview
          path: build/preview/shots
          if-no-files-found: error

  # Android app: the same home screen packaged as an APK (NativeActivity, no Java).
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: bash android/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: astro-android
          path: build/astro.apk
          if-no-files-found: error

  # Installs the APK on an Android emulator, launches it and checks that it renders.
  android-run:
    name: Run APK on emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: astro-android
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          script: bash android/run-on-emulator.sh apk/astro.apk build/emulator

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astro-android-screenshots
          path: build/emulator
          if-no-files-found: warn
